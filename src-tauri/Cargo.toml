[package]
name = "yuna-desktop"
version = "0.1.0"
description = "Yuna Desktop — Tauri v2 shell for the Yuna bridge SPA"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "yuna_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
